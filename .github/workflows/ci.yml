name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Read pinned toolchain from cyrius.cyml (single source of truth,
        # matching vani / yukti / patra CI). Version-pinned install layout
        # — cyrius CLI's stdlib resolver prefers this path. Pre-flight
        # HTTP check surfaces a clear error if the cyml pin is ahead of
        # the published cyrius release.
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          TARBALL="cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          URL="https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/$TARBALL"
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" -I "$URL")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "::error::Cyrius release $CYRIUS_VERSION not found on GitHub (HTTP $HTTP_CODE)."
            echo "::error::cyrius.cyml's 'cyrius =' pin was bumped ahead of the published release."
            exit 1
          fi
          curl -sLO "$URL"
          tar xzf "$TARBALL"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV
          # CYRIUS_STRICT_PIN turns "cyrius.cyml pins X but cycc is Y" from a
          # WARNING into a hard error (exit 1, no binary). CI installs the pin
          # itself so it can never legitimately drift — but the installer's
          # pre-flight can fall back, and a warning in a 500-line log is a
          # warning nobody reads. Verified locally 2026-08-01: with the pin at
          # 6.4.78 and cycc 6.5.4, plain build exits 0 with a warning, and
          # CYRIUS_STRICT_PIN=1 exits 1 with "toolchain drift (CYRIUS_STRICT_PIN)".
          echo "CYRIUS_STRICT_PIN=1" >> $GITHUB_ENV

      - name: Lock file present
        # cyrius.lock is the supply-chain integrity anchor for the
        # [deps.bsp] / [deps.vani] git overrides + transitive
        # [deps.yukti] / [deps.patra]. Without a committed lock,
        # `cyrius deps --verify` trivially matches the just-created
        # lock — providing zero integrity. Same gate vani / yukti use.
        run: |
          test -f cyrius.lock || {
            echo "::error::cyrius.lock missing — supply-chain integrity requires this committed"
            exit 1
          }

      - name: Resolve dependencies
        # Resolves the dep tree into ./lib/ (a gitignored build artifact copied
        # from the pinned toolchain's stdlib + the [deps.*] git overrides) and
        # (re)writes cyrius.lock to match the resolved set.
        run: cyrius deps

      - name: Verify dep hashes
        # Unconditional supply-chain gate: verifies the resolved ./lib/ file
        # hashes against cyrius.lock. cyrius.lock is committed as the presence
        # anchor (checked above) + human-auditable record; `cyrius deps` rewrites
        # it from the pinned stdlib each run, so a clean checkout verifies N/0
        # for whatever N the pinned stdlib snapshot + git-dep set resolves to.
        # (The live count is tracked in docs/development/state.md, not here — a
        # number inlined in CI YAML rots at the next pin bump; it said 37 under
        # 6.1.29 and the resolve has been 36 since 6.4.x.)
        run: cyrius deps --verify

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/doom
          echo "doom: $(wc -c < build/doom) bytes"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: doom-x86_64
          path: build/doom
          retention-days: 5

  test:
    name: Test (WAD-free subset, every tests/*.tcyr)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Read pinned toolchain from cyrius.cyml (single source of truth,
        # matching vani / yukti / patra CI). Version-pinned install layout
        # — cyrius CLI's stdlib resolver prefers this path. Pre-flight
        # HTTP check surfaces a clear error if the cyml pin is ahead of
        # the published cyrius release.
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          TARBALL="cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          URL="https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/$TARBALL"
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" -I "$URL")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "::error::Cyrius release $CYRIUS_VERSION not found on GitHub (HTTP $HTTP_CODE)."
            echo "::error::cyrius.cyml's 'cyrius =' pin was bumped ahead of the published release."
            exit 1
          fi
          curl -sLO "$URL"
          tar xzf "$TARBALL"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV
          # CYRIUS_STRICT_PIN turns "cyrius.cyml pins X but cycc is Y" from a
          # WARNING into a hard error (exit 1, no binary). CI installs the pin
          # itself so it can never legitimately drift — but the installer's
          # pre-flight can fall back, and a warning in a 500-line log is a
          # warning nobody reads. Verified locally 2026-08-01: with the pin at
          # 6.4.78 and cycc 6.5.4, plain build exits 0 with a warning, and
          # CYRIUS_STRICT_PIN=1 exits 1 with "toolchain drift (CYRIUS_STRICT_PIN)".
          echo "CYRIUS_STRICT_PIN=1" >> $GITHUB_ENV

      - name: Lock file present
        run: |
          test -f cyrius.lock || {
            echo "::error::cyrius.lock missing — supply-chain integrity requires this committed"
            exit 1
          }

      - name: Resolve dependencies
        # Resolves the dep tree into ./lib/ (a gitignored build artifact copied
        # from the pinned toolchain's stdlib + the [deps.*] git overrides) and
        # (re)writes cyrius.lock to match the resolved set.
        run: cyrius deps

      - name: Verify dep hashes
        # Unconditional supply-chain gate: verifies the resolved ./lib/ file
        # hashes against cyrius.lock. cyrius.lock is committed as the presence
        # anchor (checked above) + human-auditable record; `cyrius deps` rewrites
        # it from the pinned stdlib each run, so a clean checkout verifies N/0
        # for whatever N the pinned stdlib snapshot + git-dep set resolves to.
        # (The live count is tracked in docs/development/state.md, not here — a
        # number inlined in CI YAML rots at the next pin bump; it said 37 under
        # 6.1.29 and the resolve has been 36 since 6.4.x.)
        run: cyrius deps --verify

      - name: Run tests (WAD-free assertions)
        run: |
          # The WAD is not checked into the repo, so this runs the WAD-free
          # subset of each suite; the WAD-gated assertions need a WAD path
          # passed to the built binary and are exercised locally, not in CI.
          #
          # Every tests/*.tcyr is run, not just doom.tcyr. Naming one file meant
          # tests/regression_asr.tcyr sat RED for two weeks after v0.33.6 changed
          # asr() to floor negatives (RC-F2) without anyone noticing — CI never
          # executed it. Globbing means a new suite is gated the moment it lands.
          #
          # The success match is ANCHORED, and that is not pedantry: the old
          # `grep -q "0 failed"` matched as a SUBSTRING, so "10 failed",
          # "20 failed" … "100 failed" all contained "0 failed" and the gate
          # reported PASS. A suite failing exactly 10, 20, 30 … tests was
          # invisible — the same blindness as the regression_asr.tcyr incident
          # described above, one line below the comment describing it.
          # Verified: `echo "356 passed, 10 failed" | grep -q "0 failed"` -> match.
          # Also require the summary line to be a real summary, so a crashed or
          # non-compiling suite (which prints no summary at all) cannot pass by
          # emitting nothing.
          fail=0
          for t in tests/*.tcyr; do
            echo "=== $t ==="
            cyrius test "$t" 2>&1 | tee /tmp/test_output
            tail -1 /tmp/test_output | grep -qE '^[0-9]+ passed, 0 failed' \
              || { echo "FAILED: $t"; fail=1; }
          done
          exit $fail

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        # cyrius.toml + cyrb.toml retired in 0.27.0; cyrius.cyml is the
        # single manifest (matches patra/vani/sakshi/mihi convention).
        run: |
          for doc in README.md CHANGELOG.md VERSION LICENSE cyrius.cyml; do
            test -f "$doc" && echo "OK: $doc" || { echo "MISSING: $doc"; exit 1; }
          done

      - name: Verify version consistency
        # VERSION is the single source of truth (release.yml's "Verify
        # version" step compares it to the pushed tag). cyrius.cyml uses
        # the `${file:VERSION}` template — resolve it for the consistency
        # check. Same shape as patra/vani CI.
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          [ "$FILE_VERSION" = "$CYML_VERSION" ] || { echo "VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_RAW)"; exit 1; }
          grep -q "$FILE_VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION (cyml: $CYML_RAW)"
